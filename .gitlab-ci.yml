image: python:3.11-slim

stages:
  - build
  - deploy

variables:
  PLATFORMIO_CORE_DIR: "$CI_PROJECT_DIR/.pio-core"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "platformio-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - .pio-core/
    - .pio/packages/
    - .pio/platforms/
    - .pio/libdeps/

before_script:
  - python -m pip install --upgrade pip
  - python -m pip install platformio

build-firmware:
  stage: build
  script:
    - pio run --environment esp32-2432s028
    - mkdir -p artifacts
    - cp .pio/build/esp32-2432s028/firmware.bin artifacts/SATulator-esp32-2432s028.bin
    - cp .pio/build/esp32-2432s028/firmware.elf artifacts/SATulator-esp32-2432s028.elf
    - cp .pio/build/esp32-2432s028/firmware.map artifacts/SATulator-esp32-2432s028.map
  artifacts:
    name: "SATulator-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - artifacts/
    expire_in: 30 days
    expose_as: "SATulator firmware"

pages:
  stage: deploy
  before_script: []
  script:
    - mkdir -p public
    - cp -R docs/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
