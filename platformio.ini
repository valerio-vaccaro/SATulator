[platformio]
default_envs = esp32-2432s028

[env:esp32-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
; This project embeds the requested splash artwork and has no OTA update path.
; Use one larger application slot instead of the default two small OTA slots.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps =
  tzapu/WiFiManager @ ^2.0.17
  bodmer/TFT_eSPI @ ^2.5.43
  lvgl/lvgl @ ^8.3.11
build_flags =
  -I include
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  ; ESP32-2432S028 CYD wiring (not the ESP32 VSPI defaults).
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=4
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  ; USER_SETUP_LOADED bypasses TFT_eSPI's font defaults; the splash uses these.
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LV_CONF_INCLUDE_SIMPLE
